# SonarQube Cloud: https://sonarcloud.io/summary/new_code?id=paxel_chaos-alert
# Analysed by .github/workflows/sonar.yml on pushes to summer.
sonar.organization=paxel
sonar.projectKey=paxel_chaos-alert
sonar.projectName=chaos-alert

# Dart (app and core) and Kotlin (Android).
sonar.sources=lib,\
  packages/chaos_core/lib,\
  android/app/src/main
sonar.tests=test,\
  packages/chaos_core/test,\
  android/app/src/test

# Generated code and build output. GeneratedPluginRegistrant.java is
# written by `flutter pub get`; analysing Java would need compiled classes.
sonar.exclusions=lib/l10n/app_localizations*.dart,\
  build/**,\
  **/GeneratedPluginRegistrant.java
sonar.sourceEncoding=UTF-8

# Coverage: tool/coverage.sh writes these LCOV files, generated code
# already left out. The core's paths start at the repository root
# (packages/chaos_core/lib/...), the app's at lib/.
sonar.dart.lcov.reportPaths=coverage/lcov.info,packages/chaos_core/coverage/lcov.info
# Kotlin (android/): JaCoCo XML from the app's debug unit tests
# (enableUnitTestCoverage, :app:createDebugUnitTestCoverageReport). Flutter
# moves the Gradle build directory to build/app at the repository root.
sonar.coverage.jacoco.xmlReportPaths=build/app/reports/coverage/test/debug/report.xml
