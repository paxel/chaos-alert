name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Read-only by default; a job that writes asks for more itself.
permissions:
  contents: read

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Core — analyze and test
        working-directory: packages/chaos_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: App — analyze and test
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - name: Tools — test
        run: python3 -m unittest discover -s tool

  # Known vulnerabilities in either pubspec.lock fail every push. A notice
  # that a package is unmaintained is listed but does not fail;
  # tool/osv_gate.py decides. Ignores live in an osv-scanner.toml beside
  # the lockfile. The weekly Security run stays stricter.
  osv-scanner:
    name: Vulnerable dependencies (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Exits 1 on any finding, unmaintained notices too; the next step
      # decides from the results, and fails when there are none.
      - name: osv-scanner
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --format=json
            --output-file=osv-results.json
            --recursive
            ./
      - name: No known vulnerability (unmaintained notices reported only)
        run: python3 tool/osv_gate.py osv-results.json

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
      - name: Kotlin unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest
