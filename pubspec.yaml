name: chaos_alert
description: "Bedtime nag and random-sound alarm with a word-memory quiz."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  chaos_core:
    path: packages/chaos_core
  intl: any
  path_provider: ^2.1.6
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/words.txt
    - assets/WORDS-LICENSE.txt
