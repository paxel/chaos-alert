<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="-820 -820 1640 1640">
  <!-- Adaptive-icon foreground, generated from icon.svg with a wider viewBox. chaos-alert: a black chaos star with a red alarm clock at its heart. -->
  <defs>
    <g id="arrow">
      <rect x="-22" y="-360" width="44" height="360" />
      <polygon points="0,-470 -70,-340 70,-340" />
    </g>
  </defs>
  <g id="star" fill="#000">
    <use href="#arrow" transform="rotate(0)" />
    <use href="#arrow" transform="rotate(45)" />
    <use href="#arrow" transform="rotate(90)" />
    <use href="#arrow" transform="rotate(135)" />
    <use href="#arrow" transform="rotate(180)" />
    <use href="#arrow" transform="rotate(225)" />
    <use href="#arrow" transform="rotate(270)" />
    <use href="#arrow" transform="rotate(315)" />
  </g>
  <g id="alarm">
    <!-- bells -->
    <circle cx="-118" cy="-128" r="62" fill="#D50000" stroke="#fff" stroke-width="14" />
    <circle cx="118" cy="-128" r="62" fill="#D50000" stroke="#fff" stroke-width="14" />
    <!-- legs -->
    <rect x="-130" y="120" width="36" height="78" rx="12" fill="#D50000" transform="rotate(30 -112 120)" />
    <rect x="94" y="120" width="36" height="78" rx="12" fill="#D50000" transform="rotate(-30 112 120)" />
    <!-- body and face -->
    <circle r="168" fill="#D50000" stroke="#fff" stroke-width="16" />
    <circle r="118" fill="#fff" />
    <!-- hands -->
    <line x1="0" y1="0" x2="0" y2="-88" stroke="#000" stroke-width="18" stroke-linecap="round" />
    <line x1="0" y1="0" x2="62" y2="34" stroke="#000" stroke-width="18" stroke-linecap="round" />
    <circle r="16" fill="#D50000" />
  </g>
  <!-- Ringing marks, with a white halo where they cross the arrows. -->
  <g fill="none" stroke="#fff" stroke-width="40" stroke-linecap="round">
    <path d="M -236 -150 A 120 120 0 0 1 -150 -236" />
    <path d="M -280 -130 A 170 170 0 0 1 -130 -280" />
    <path d="M 236 -150 A 120 120 0 0 0 150 -236" />
    <path d="M 280 -130 A 170 170 0 0 0 130 -280" />
  </g>
  <g id="ringing" fill="none" stroke="#D50000" stroke-width="18" stroke-linecap="round">
    <path d="M -236 -150 A 120 120 0 0 1 -150 -236" />
    <path d="M -280 -130 A 170 170 0 0 1 -130 -280" />
    <path d="M 236 -150 A 120 120 0 0 0 150 -236" />
    <path d="M 280 -130 A 170 170 0 0 0 130 -280" />
  </g>
</svg>
